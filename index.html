<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Barkaoui - Portfolio en génie mécanique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #00205B; /* Bleu officiel Airbus */
      --primary-hover: #00143a;
      --bg-sidebar: #f8f9fa;
      --text-color: #1a252c;
      --text-muted: #6c757d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      color: var(--text-color);
      background-color: #fff;
    }
    
    /* Sidebar Layout */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      height: 100vh;
      position: fixed;
      padding: 30px 20px;
      border-right: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 5px;
      display: inline-block;
      color: var(--primary-color);
    }
    .nav-links { list-style: none; margin-bottom: 30px; }
    .nav-links li { margin-bottom: 12px; }
    .nav-links a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--primary-color); }

    .contact-box { font-size: 0.85rem; color: var(--text-muted); margin-top: auto; padding-top: 20px; }
    .contact-box h4 {
      color: var(--primary-color);
      margin-bottom: 10px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 3px;
      display: inline-block;
    }
    .contact-box p { margin-bottom: 8px; line-height: 1.4; }
    .contact-box a { color: var(--primary-color); text-decoration: none; word-break: break-all; }
    .contact-box a:hover { text-decoration: underline; }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      padding: 50px;
      width: calc(100% - 280px);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 3px solid var(--primary-color);
      margin-bottom: 40px;
    }
    .header-bar h1 { font-size: 1.4rem; color: var(--primary-color); }
    .header-bar span { font-weight: normal; color: var(--text-muted); font-size: 1rem; }
    .linkedin-icon { font-size: 1.5rem; color: #0077b5; text-decoration: none; }

    /* Hero Section */
    .hero {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
      align-items: start;
      margin-bottom: 60px;
    }
    .hero-text h2 {
      font-size: 2.5rem;
      line-height: 1.2;
      margin-bottom: 15px;
      color: var(--primary-color);
    }
    .hero-text .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .hero-text p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #444;
      margin-bottom: 25px;
    }
    .highlight { font-weight: bold; color: var(--primary-color); }

    .btn-group { display: flex; gap: 15px; }
    .btn {
      padding: 10px 20px;
      border: 2px solid var(--primary-color);
      background: transparent;
      color: var(--primary-color);
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: all 0.3s;
      text-align: center;
    }
    .btn:hover { background: var(--primary-color); color: #fff; }

    .profile-img img {
      width: 100%;
      max-height: 480px;
      border-radius: 4px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,32,91,0.15);
    }

    /* Sections */
    .section-title {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 20px;
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 8px;
      display: inline-block;
    }
    .section-divider { border: 0; border-top: 1px solid #e9ecef; margin: 40px 0; }

    .about-text {
      font-size: 1rem;
      line-height: 1.7;
      color: #444;
      margin-bottom: 40px;
    }

    /* Grid cards */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin-bottom: 50px;
    }
    .card-item {
      background: #fdfdfd;
      border: 1px solid #e0e6ed;
      padding: 25px;
      border-radius: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(0, 32, 91, 0.08);
    }
    .card-item i {
      font-size: 2rem;
      color: var(--primary-color);
    }
    .card-item h3 { font-size: 1.2rem; color: var(--primary-color); }
    .card-item p { font-size: 0.95rem; color: #555; line-height: 1.5; }

    .footer-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 60px;
      border-top: 1px solid #e9ecef;
      padding-top: 20px;
    }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .main-content { margin-left: 0; width: 100%; padding: 20px; }
      .hero { grid-template-columns: 1fr; }
      .grid-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>Menu</h3>
    <ul class="nav-links">
      <li><a href="#accueil"><i class="fa-solid fa-house"></i> ACCUEIL</a></li>
